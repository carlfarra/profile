<html>
  <head>
    <title>Carl Farra</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.2/css/all.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="container">
      <div class="gaze-zones">
        <div class="zone zone-tl"></div>
        <div class="zone zone-tr"></div>
        <div class="zone zone-bl"></div>
        <div class="zone zone-br"></div>
      </div>
      <h1>hi i'm carl!</h1>
      <div class="avatar-wrapper">
        <img src="images/avatar.png" alt="Avatar">


        <div class="eyes">
          <div class="eye left-eye">
            <div class="pupil"></div>
          </div>
          <div class="eye right-eye">
            <div class="pupil"></div>
          </div>
        </div>


        <div class="bubble bubble-1">hello there!</div>
        <div class="bubble bubble-2">nice to meet you!</div>
        <div class="bubble bubble-3">take a look around</div>
      </div>


      <p>i'm a <strong>game designer</strong> living in paris <br>who loves making cute playful puzzles. </p>
    </div>

    <div class="card">
      <p>Get in touch!</p>

      <ul>
        <li id="blue-button">
          <a href="https://linkedin.com/in/carlfarra" target="_blank">
            <i class="fab fa-linkedin"></i> linkedin
          </a>
        </li>
        <li id="yellow-button">
          <a href="https://x.com/carlfarra" target="_blank">
            <i class="fab fa-twitter"></i> twitter
          </a>
        </li>
      </ul>
    </div>

  </body>

</html>
